services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-HelpDesk@123!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/HelpDesk.Api/Dockerfile
    environment:
      - ConnectionStrings__HelpDeskDb=Server=db,1433;Database=HelpDeskDb;User Id=sa;Password=${SA_PASSWORD:-HelpDesk@123!};TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__Secret=${JWT_SECRET:-at-least-32-characters-long-secret-change-me-1234567890}
      - Jwt__Issuer=HelpDesk.Api
      - Jwt__Audience=HelpDesk.Client
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD:-HelpDesk@123}
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__Origins=http://localhost:3000,http://frontend
      - Ai__ApiKey=${AI_API_KEY:-}
      - Ai__BaseUrl=${AI_BASE_URL:-https://openrouter.ai/api/v1}
      - Ai__Model=${AI_MODEL:-minimax/minimax-m3:free}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api-uploads:/app/uploads

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mssql-data:
  api-uploads:
